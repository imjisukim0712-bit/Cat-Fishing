<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>까미와 밤낚시</title>
<style>
  :root{
    --bg:#080d1a;
    --panel:#121a30;
    --panel2:#1b2544;
    --line:#2c3a63;
    --gold:#ffc24a;
    --text:#e8edfb;
    --dim:#8b98bd;
    --c-junk:#8d93a3;
    --c-common:#cfd9ef;
    --c-rare:#49a6ff;
    --c-epic:#b06bff;
    --c-legend:#ffb020;
    --c-myth:#ff2d3a;
    --c-trans:#fff4d6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #17224a 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:14px;overflow:hidden;
    word-break:keep-all;overflow-wrap:break-word;
  }
  #app{width:100%;max-width:980px;display:flex;flex-direction:column;gap:10px}
  @media (max-height:480px){
    body{overflow-y:auto;align-items:flex-start}
  }

  /* ---------- HUD ---------- */
  #hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:-.5px;font-size:17px;display:flex;align-items:center;gap:7px;margin-right:auto}
  .brand small{font-weight:600;color:var(--dim);font-size:11px}
  .chip{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:clamp(5px,1.8vw,7px) clamp(9px,3vw,13px);font-size:clamp(11px,3.1vw,13px);font-weight:700;display:flex;align-items:center;gap:6px;
  }
  .chip.coin{color:var(--gold);border-color:#4a3c17;background:#1e1806}
  button.btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:999px;padding:clamp(5px,1.8vw,7px) clamp(9px,3.2vw,14px);font-size:clamp(11px,3.1vw,13px);font-weight:700;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  button.btn:hover{background:var(--panel2);border-color:#3d5091;transform:translateY(-1px)}
  button.btn:active{transform:translateY(0)}
  button.btn.gold{background:#3a2c08;border-color:#6b5216;color:var(--gold)}
  .badge{background:#e0454f;color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:800}

  /* ---------- STAGE ---------- */
  #stage{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.03);
    background:#050914;cursor:pointer;
  }
  #scene{display:block;width:100%;height:100%}

  /* stageWrap: 기본(좁은 화면)에서는 그냥 껍데기일 뿐이라 #stage와 #status가
     #app에 바로 이어붙는 것처럼 세로로 쌓인다 — 캔버스 게이지와 안내 문구가
     겹치지 않도록. 넓은 화면(원래 데스크톱 UI)에서는 아래 미디어쿼리가
     #status를 다시 스테이지 위에 겹쳐 올린다. */
  #stageWrap{display:contents}

  /* status line */
  #status{
    width:max-content;max-width:92%;margin:0 auto;
    background:rgba(8,12,26,.78);border:1px solid var(--line);backdrop-filter:blur(6px);
    padding:clamp(6px,1.8vw,8px) clamp(11px,4vw,18px);border-radius:999px;
    font-size:clamp(11px,3.6vw,14px);font-weight:700;white-space:normal;
    pointer-events:none;transition:.2s;text-align:center;
  }
  #status .k{color:var(--gold)}
  #status.hot{border-color:#e0454f;background:rgba(80,10,16,.85);animation:pulse .35s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

  /* speech bubble */
  #bubble{
    position:absolute;left:21%;top:6%;max-width:46%;
    background:#fff;color:#1b2033;border-radius:clamp(11px,3vw,16px);padding:clamp(9px,2.6vw,12px) clamp(11px,3.2vw,15px);
    font-size:clamp(11.5px,3.4vw,14px);font-weight:600;line-height:1.5;letter-spacing:-.2px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(8px) scale(.94);
    transition:.25s cubic-bezier(.2,1.4,.4,1);pointer-events:none;z-index:5;
  }
  #bubble.on{opacity:1;transform:translateY(0) scale(1)}
  #bubble:after{content:"";position:absolute;left:26px;bottom:-11px;border:11px solid transparent;border-top-color:#fff;border-bottom:0}
  #bubble .who{display:block;font-size:clamp(9.5px,2.6vw,11px);font-weight:800;color:#e0454f;margin-bottom:3px}

  /* floating text */
  .float-txt{position:absolute;font-weight:900;font-size:clamp(13px,4.2vw,20px);pointer-events:none;z-index:6;
    text-shadow:0 2px 8px rgba(0,0,0,.8);animation:ft 1.1s ease-out forwards}
  @keyframes ft{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

  /* ---------- CELEBRATION ---------- */
  #celebrate{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
  #celebrate.on{display:flex}
  #celebrate .flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  #celebrate .rays{position:absolute;width:200%;height:200%;
    background:repeating-conic-gradient(from 0deg, rgba(255,200,70,.30) 0deg 9deg, rgba(255,200,70,0) 9deg 18deg);
    animation:spin 7s linear infinite;mix-blend-mode:screen}
  @keyframes spin{to{transform:rotate(360deg)}}
  #celebrate .cl-inner{position:relative;text-align:center;animation:pop .6s cubic-bezier(.15,1.7,.4,1)}
  @keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  #celebrate .tier{font-size:clamp(26px,8vw,54px);font-weight:900;letter-spacing:-2px;
    background:linear-gradient(180deg,#fff6c9,#ffb020 55%,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,170,30,.9);filter:drop-shadow(0 4px 0 rgba(120,50,0,.5))}
  #celebrate .fishbig{width:clamp(150px,34vw,280px);height:clamp(94px,21vw,175px);margin:4px auto;animation:wob .55s ease-in-out infinite alternate;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
  .fish-art{display:block;width:100%;height:100%;object-fit:contain}
  @keyframes wob{from{transform:rotate(-11deg) scale(1)}to{transform:rotate(11deg) scale(1.08)}}
  #celebrate .fname{font-size:clamp(17px,5vw,30px);font-weight:900;color:#fff;margin-top:4px;text-shadow:0 3px 14px rgba(0,0,0,.8)}
  #celebrate .meow{margin-top:8px;font-size:clamp(13px,4vw,20px);font-weight:800;color:#ffe6a3;animation:sh .12s infinite alternate}
  #celebrate.myth .rays{background:repeating-conic-gradient(from 0deg,rgba(255,45,58,.36) 0deg 7deg,rgba(255,140,60,.10) 7deg 14deg,rgba(255,45,58,0) 14deg 21deg)}
  #celebrate.myth .tier{background:linear-gradient(180deg,#fff,#ffb020 32%,#ff2d3a 72%,#7a0d15);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 46px rgba(255,45,58,.95);filter:drop-shadow(0 4px 0 rgba(90,10,15,.65))}
  #celebrate.myth .meow{color:#ffd0d3}
  #celebrate.trans .rays{background:repeating-conic-gradient(from 0deg,rgba(255,244,214,.36) 0deg 6deg,rgba(155,232,255,.24) 6deg 12deg,rgba(255,214,245,.24) 12deg 18deg,rgba(255,244,214,0) 18deg 24deg);animation:spin 4.5s linear infinite}
  #celebrate.trans .tier{background:linear-gradient(90deg,#fff,#9be8ff,#ffd6f5,#fff4d6,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(255,255,255,.95);animation:transShift 2.2s linear infinite}
  #celebrate.trans .meow{color:#fff4d6}
  #celebrate.trans .fishbig{animation:wob .4s ease-in-out infinite alternate}
  @keyframes transShift{0%{background-position:0% 0}100%{background-position:300% 0}}
  @keyframes sh{from{transform:translateX(-3px)}to{transform:translateX(3px)}}

  /* ---------- MODALS ---------- */
  .ovl{position:fixed;inset:0;background:rgba(4,7,16,.78);backdrop-filter:blur(5px);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ovl.on{display:flex}
  .modal{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.7);
    animation:mp .22s cubic-bezier(.2,1.3,.4,1)}
  @keyframes mp{from{transform:translateY(18px) scale(.97);opacity:0}}
  .modal h2{font-size:19px;margin-bottom:3px;display:flex;align-items:center;gap:8px}
  .modal .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .mhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .mhead .x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .mhead .x:hover{color:#fff}

  .row{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .row .ico{font-size:26px;width:34px;text-align:center;flex:none}
  .row .ico.fish-ico{width:58px;height:42px;display:flex;align-items:center;justify-content:center}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .row .ds{font-size:11.5px;color:var(--dim);margin-top:2px}
  .row .acts{display:flex;gap:6px;flex:none}
  .mini{border:1px solid var(--line);background:#0e1526;color:var(--text);border-radius:9px;
    padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:.13s;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
  .mini:hover{background:#22305a}
  .mini.buy{background:#2b3f1a;border-color:#4d7226;color:#c8f08a}
  .mini.buy:disabled{background:#181d2c;border-color:#28304a;color:#4d566f;cursor:not-allowed}
  .mini.sell{background:#3a2c08;border-color:#6b5216;color:var(--gold)}
  .mini.feed{background:#3a1524;border-color:#7a2a45;color:#ffb1c8}
  .shop-section{margin:18px 0 9px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;font-weight:900}
  .outfit-lock{padding:22px 16px;text-align:center;background:linear-gradient(135deg,#171d35,#251b38);border:1px dashed #68527d;border-radius:14px;color:var(--dim)}
  .outfit-lock b{display:block;color:#e8c8ff;font-size:15px;margin-bottom:5px}
  .outfit-row.equipped{border-color:#ffb020;box-shadow:inset 0 0 18px rgba(255,176,32,.08)}
  .outfit-row.locked-outfit{opacity:.45}
  .outfit-row.locked-outfit .buy{cursor:not-allowed}

  .bar{height:6px;background:#0b1122;border-radius:99px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#4a8cff,#8ad4ff)}

  .tag{font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px;border:1px solid currentColor}
  .r-junk{color:var(--c-junk)} .r-common{color:var(--c-common)} .r-rare{color:var(--c-rare)}
  .r-epic{color:var(--c-epic)} .r-legend{color:var(--c-legend)} .r-myth{color:var(--c-myth)}
  .r-myth{text-shadow:0 0 10px rgba(255,45,58,.65)}
  .r-trans{color:var(--c-trans);text-shadow:0 0 8px rgba(255,255,255,.75),0 0 16px rgba(155,232,255,.55),0 0 24px rgba(255,214,245,.45)}

  .empty{text-align:center;color:var(--dim);padding:34px 0;font-size:13.5px}
  .dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .dexcell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
  .dexcell.locked{opacity:.35}
  .dexcell .e{height:54px;font-size:24px;display:flex;align-items:center;justify-content:center}
  .dexcell .n{font-size:11px;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dexcell .c{font-size:10px;color:var(--dim);margin-top:1px}

  /* result modal */
  #resultCard{text-align:center}
  #resultCard .rf{width:min(100%,240px);height:138px;margin:0 auto;animation:wob2 .8s ease-in-out infinite alternate}
  @keyframes wob2{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  #resultCard .rn{font-size:23px;font-weight:900;margin-top:6px}
  #resultCard .rm{color:var(--dim);font-size:13px;margin-top:4px}
  #resultCard .rp{font-size:17px;font-weight:900;color:var(--gold);margin-top:9px}
  #resultCard .btns{display:flex;gap:8px;margin-top:16px}
  #resultCard .btns button{flex:1;padding:12px 8px;border-radius:12px;font-size:13.5px}

  .hearts{letter-spacing:1px}
  .foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .foot .note{font-size:11px;color:var(--dim);flex:1}
  .keys{text-align:center;font-size:11.5px;color:var(--dim)}
  .keys b{color:var(--text)}
  .credit{text-align:center;font-size:10px;color:#3a4468;margin-top:2px;user-select:text}
  @media (max-width:560px){
    .brand small{display:none}
    #bubble{max-width:60%;left:14%}
  }
  @media (max-width:480px){
    .modal{padding:16px}
    #resultCard .btns{flex-direction:column}
    #resultCard .btns button{flex:none;width:100%}
  }
  @media (min-width:640px){
    /* 넓은 화면(데스크톱)에서는 원래 UI대로 안내 문구를 스테이지 하단에 겹쳐 올린다 */
    #stageWrap{display:grid}
    #stage, #status{grid-area:1/1}
    #status{align-self:end;justify-self:center;margin:0 0 1.97% 0}
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="brand">🐈‍⬛ 까미와 밤낚시 <small>Kkami's Midnight Fishing</small></div>
    <div class="chip coin">🪙 <span id="coins">0</span></div>
    <div class="chip">💗 <span id="affLabel" class="hearts">♡♡♡♡♡</span></div>
    <div class="chip" id="weatherChip" title="">🌙 맑음</div>
    <button class="btn" id="btnCreel">🧺 어망 <span class="badge" id="creelN">0</span></button>
    <button class="btn gold" id="btnShop">🛒 상점</button>
    <button class="btn" id="btnDex">📖 도감</button>
    <button class="btn" id="btnSound">🔊</button>
  </div>

  <div id="stageWrap">
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="bubble"><span class="who">까미</span><span id="bubbleText"></span></div>
      <div id="celebrate">
        <div class="flash"></div>
        <div class="rays"></div>
        <div class="cl-inner">
          <div class="tier" id="clTier">전설 등급!!!</div>
        <div class="fishbig" id="clFish"></div>
          <div class="fname" id="clName"></div>
          <div class="meow" id="clMeow">냐아아아앙!!! 이거 실화냥?!</div>
        </div>
      </div>
    </div>

    <div id="status">클릭 또는 <span class="k">스페이스</span>로 낚싯대를 던져요</div>
  </div>

  <div class="keys">🎣 <b>스페이스</b> / <b>클릭</b> = 던지기 · 챔질 · 릴 감기 &nbsp;·&nbsp; 잡은 물고기는 팔거나 <b>까미에게</b> 주세요</div>
  <div class="credit">제작자: 김지수 (imjisukim0712@gmail.com)</div>
</div>

<!-- 어망 -->
<div class="ovl" id="ovlCreel"><div class="modal">
  <div class="mhead"><div>
    <h2>🧺 어망</h2>
    <div class="sub">팔아서 코인을 벌거나, 까미에게 주면 농담을 들려줘요.</div>
  </div><button class="x" data-close>×</button></div>
  <div id="creelList"></div>
  <div class="foot">
    <div class="note" id="creelSum"></div>
    <button class="mini sell" id="btnSellAll">전부 팔기</button>
  </div>
</div></div>

<!-- 상점 -->
<div class="ovl" id="ovlShop"><div class="modal">
  <div class="mhead"><div>
    <h2>🛒 부둣가 잡화점</h2>
    <div class="sub">장비를 강화하고, 까미와 절친이 되면 특별한 옷도 골라주세요.</div>
  </div><button class="x" data-close>×</button></div>
  <div id="shopList"></div>
  <div id="outfitShop"></div>
  <div class="foot">
    <div class="note">보유 코인 🪙 <b id="shopCoins">0</b></div>
    <button class="mini" id="btnReset">기록 초기화</button>
  </div>
</div></div>

<!-- 도감 -->
<div class="ovl" id="ovlDex"><div class="modal">
  <div class="mhead"><div>
    <h2>📖 어류 도감</h2>
    <div class="sub" id="dexSub"></div>
  </div><button class="x" data-close>×</button></div>
  <div id="dexList"></div>
</div></div>

<!-- 결과 -->
<div class="ovl" id="ovlResult"><div class="modal" style="max-width:400px">
  <div id="resultCard">
    <div class="rf" id="rFish"></div>
    <div class="rn" id="rName"></div>
    <div class="rm" id="rMeta"></div>
    <div class="rp" id="rPrice"></div>
    <div class="btns">
      <button class="mini" id="rKeep">🧺 어망에 넣기</button>
      <button class="mini sell" id="rSell">🪙 바로 팔기</button>
      <button class="mini feed" id="rFeed">🐾 까미 주기</button>
    </div>
  </div>
</div></div>

<script>
"use strict";
/* ======================================================================
   까미와 밤낚시 — single file game
   ====================================================================== */

/* ------------------------- 데이터 ------------------------- */
const RARITY = {
  junk:   {key:'junk',   name:'잡동사니', cls:'r-junk',   col:'#8d93a3', w:16, need:2, spd:0.50, zone:1.35},
  common: {key:'common', name:'일반',     cls:'r-common', col:'#cfd9ef', w:48, need:3, spd:0.72, zone:1.15},
  rare:   {key:'rare',   name:'희귀',     cls:'r-rare',   col:'#49a6ff', w:23, need:3, spd:0.95, zone:1.00},
  epic:   {key:'epic',   name:'영웅',     cls:'r-epic',   col:'#b06bff', w:9.5,need:4, spd:1.18, zone:0.84},
  legend: {key:'legend', name:'전설',     cls:'r-legend', col:'#ffb020', w:2.2,need:5, spd:1.45, zone:0.66},
  myth:   {key:'myth',   name:'신화',     cls:'r-myth',   col:'#ff2d3a', w:0.35,need:6,spd:1.70, zone:0.52},
  trans:  {key:'trans',  name:'초월',     cls:'r-trans',  col:'#fff4d6', w:0,   need:7,spd:2.00, zone:0.40},
};
const RORDER = ['junk','common','rare','epic','legend','myth','trans'];

const FISH = [
  {id:'boot',   n:'낡은 장화',      e:'👢', r:'junk',   p:3,   cm:[20,32]},
  {id:'can',    n:'찌그러진 깡통',  e:'🥫', r:'junk',   p:4,   cm:[10,16]},
  {id:'news',   n:'젖은 신문지',    e:'📰', r:'junk',   p:2,   cm:[25,40]},
  {id:'weed',   n:'해초 뭉치',      e:'🌿', r:'junk',   p:3,   cm:[15,55]},

  {id:'bung',   n:'붕어',           e:'🐟', r:'common', p:9,   cm:[12,26]},
  {id:'pira',   n:'피라미',         e:'🐠', r:'common', p:7,   cm:[7,15]},

function pickWeatherKey(excludeKey){
  const pool = WEATHERS.filter(w=>w.key!==excludeKey);
  const total = pool.reduce((a,w)=>a+w.w,0);
  let r = Math.random()*total;
  for(const w of pool){ r -= w.w; if(r<=0) return w.key; }
  return pool[pool.length-1].key;
}

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur=0.12, type='sine', vol=0.16, delay=0){
  if(!S.sound) return;
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur=0.25, vol=0.13){
  if(!S.sound) return;
  const c = ac(); if(!c) return;
  const n = Math.floor(c.sampleRate*dur);
  const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
  const s = c.createBufferSource(); s.buffer = b;
  const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
  const g = c.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
const SFX = {
  cast(){ tone(320,.08,'triangle',.10); noise(.2,.1); },
  bite(){ tone(880,.09,'square',.14); tone(1180,.09,'square',.12,.09); },
  hit(i){ tone(520+i*130,.10,'triangle',.15); },
  miss(){ tone(180,.16,'sawtooth',.11); },
  catchS(){ [523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.15,i*0.07)); },
  escape(){ [400,330,247].forEach((f,i)=>tone(f,.18,'sine',.12,i*0.09)); },
  coin(){ tone(1046,.07,'square',.11); tone(1568,.09,'square',.10,.06); },
  meow(){ tone(660,.18,'sine',.13); tone(520,.22,'sine',.12,.14); },
  fanfare(){
    const m=[523,659,784,1046,1318,1046,1318,1568];
    m.forEach((f,i)=>{ tone(f,.30,'triangle',.17,i*0.11); tone(f/2,.30,'sine',.09,i*0.11); });
    for(let i=0;i<6;i++) noise(.3,.06);
  },
};

/* 캔버스는 960x540 논리 좌표를 스테이지 실제 크기로 늘려 그리므로,

}

const U = {
  wx(){ return WEATHER_FX[R.weather.key] || WEATHER_FX.clear; },
  zone(){ return (0.20 + 0.019*(S.upg.rod-1)) * this.wx().zoneMul; },

  waitTime(){ return Math.max(0.4, ((1.3 + Math.random()*3.4) - 0.26*(S.upg.float-1)) * this.wx().waitMul); },

  outfitMul(){ const o = OUTFIT_BY_ID[S.outfit]; return o ? 1 + o.bonus/100 : 1; },
  weatherFishChance(){ return 0.006 * U.baitMul() * U.outfitMul(); },
};

/* ------------------------- 물고기 뽑기 ------------------------- */
function buildFish(def, power){
  const g = (Math.random()+Math.random()+Math.random())/3;
  const sizeMul = U.wx().sizeMul;
  const cm = +(def.cm[0] + (def.cm[1]-def.cm[0]) * Math.min(1, g*0.75 + power*0.25 + sizeMul)).toFixed(1);
  const sizeRatio = (cm - def.cm[0]) / Math.max(1,(def.cm[1]-def.cm[0]));
  const price = Math.max(1, Math.round(def.p * (0.65 + sizeRatio*0.85) * U.priceMul()));
  return {uid: 'f'+Date.now()+Math.random().toString(36).slice(2,6), id:def.id, n:def.n, e:def.e, r:def.r, cm, price};
}
function rollFish(power){
  const wfId = currentWeatherFishId();
  if(wfId && Math.random() < U.weatherFishChance()){
    return buildFish(FISH_BY_ID[wfId], power);
  }
  const bm = U.baitMul() * U.outfitMul() * U.wx().rareMul * (1 + power*0.55);   // 멀리 던질수록 대물, 옷·날씨도 한몫
  const weights = RORDER.map(k=>{
    const base = RARITY[k].w;
    if(k==='junk')   return base / (1 + power*0.9) / (1 + (S.upg.bait-1)*0.18);
    if(k==='common') return base;
    return base * bm;
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total, pick = 'common';
  for(let i=0;i<RORDER.length;i++){ r -= weights[i]; if(r<=0){ pick = RORDER[i]; break; } }
  const pool = FISH.filter(f=>f.r===pick);
  const def = pool[Math.floor(Math.random()*pool.length)];
  return buildFish(def, power);
}

  const f = R.fight;

function fightTap(){
  const f = R.fight;
  if(f.lock>0) return;
  f.lock = 0.09;
  const inZone = Math.abs(f.pos - f.zc) <= f.zw/2;
  if(inZone){
    f.hits++; f.flashT=0.28; f.flashOk=true;
    SFX.hit(f.hits);
    popText('좋아!', 50 + Math.random()*10, 78, '#8af08a');
    if(f.hits >= f.need){ succeed(); return; }
    f.spd *= 1.06; newZone();

    R.shake = Math.max(R.shake, 6);
    SFX.miss();
    popText('빗나감!', 50 + Math.random()*10, 78, '#ff8a8a');
    if(f.miss >= f.maxMiss){ fail(); return; }

  }
}

    const a = Math.random()*Math.PI*2, s = 90+Math.random()*330;
    R.parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-70, g:340,
      r:2.2+Math.random()*3.6, c:cols[Math.floor(Math.random()*cols.length)],
      a:1, life:1.3+Math.random()*.7, t:0, sq:true, rot:Math.random()*6.28, vr:(Math.random()-.5)*12});
  }
}

    for(const d of R.rain){
      d.y += d.spd*dt; d.x -= d.spd*0.18*dt;
      if(d.y>H || d.x<-20){ d.y = -10-Math.random()*40; d.x = Math.random()*(W+80)-40; }
    }
  }else if(R.rain.length){ R.rain.length = 0; }

  if(key==='meteor'){
    R.meteorCd -= dt;
    if(R.meteorCd<=0){
      R.meteorCd = 0.5 + Math.random()*0.9;
      R.meteors.push({x:Math.random()*W*0.7+W*0.15, y:-20, ang:1.05+Math.random()*0.25,
        spd:640+Math.random()*260, t:0, life:0.55+Math.random()*0.2, len:70+Math.random()*60});
    }
  }
  for(let i=R.meteors.length-1;i>=0;i--){
    const m = R.meteors[i];
    m.t += dt; m.x += Math.cos(m.ang)*m.spd*dt; m.y += Math.sin(m.ang)*m.spd*dt;
    if(m.t>m.life) R.meteors.splice(i,1);
  }

  if(key==='storm'){
    if(R.lightning>0) R.lightning -= dt*1.6;
    if(Math.random() < dt*0.35 && R.lightning<=0){
      R.lightning = 1; R.shake = Math.max(R.shake, 16);
      tone(90,.3,'sawtooth',.14); noise(.4,.12);
    }
  }else if(R.lightning>0){ R.lightning = Math.max(0, R.lightning - dt*3); }
}
function drawWeatherFX(t){
  const key = R.weather.key;
  if(key==='rain'){
    ctx.save();
    ctx.strokeStyle='rgba(190,220,255,.45)'; ctx.lineWidth=1.4; ctx.lineCap='round';
    for(const d of R.rain){
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x-d.len*0.32, d.y+d.len); ctx.stroke();
    }
    ctx.restore();
  }
  if(key==='fog'){
    ctx.save();
    for(let i=0;i<3;i++){
      const y = WATER-70 + i*55 + Math.sin(t*0.35+i)*10;
      const grad = ctx.createLinearGradient(0,y-40,0,y+40);
      grad.addColorStop(0,'rgba(210,225,240,0)');
      grad.addColorStop(.5,`rgba(210,225,240,${0.12+0.05*Math.sin(t*0.5+i)})`);
      grad.addColorStop(1,'rgba(210,225,240,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, y-40, W, 80);
    }
    ctx.restore();
  }
  if(key==='hightide'){
    ctx.save();
    ctx.fillStyle='rgba(80,160,255,.10)';
    ctx.fillRect(0, WATER-14, W, 14 + Math.sin(t*1.4)*3);
    ctx.restore();
  }
  if(key==='meteor'){
    ctx.save();
    for(const m of R.meteors){
      const k = 1 - m.t/m.life;
      ctx.strokeStyle = `rgba(255,244,214,${0.75*k})`;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - Math.cos(m.ang)*m.len, m.y - Math.sin(m.ang)*m.len);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${0.9*k})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, 2.4, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
  if(key==='storm'){
    ctx.save();
    ctx.fillStyle='rgba(4,6,14,.28)';
    ctx.fillRect(0,0,W,WATER);
    ctx.restore();
    if(R.lightning>0){
      ctx.save();
      ctx.globalAlpha = Math.min(.6, R.lightning*0.6);
      ctx.fillStyle = '#dfe9ff';
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
  }
}

/* ------------------------- 루프 ------------------------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt); render(now/1000, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function update(dt){
  R.t += dt; R.moodT += dt;
  if(R.shake>0) R.shake = Math.max(0, R.shake - dt*46);
  if(R.flash>0) R.flash = Math.max(0, R.flash - dt*2.2);
  if(R.moodT>2.2 && R.catMood!=='idle' && R.mode!=='fight' && R.mode!=='bite') R.catMood='idle';

  // 눈 깜빡임
  R.nextBlink -= dt;
  if(R.nextBlink<=0){ R.blink = 0.16; R.nextBlink = 1.6 + Math.random()*3.4; }
  if(R.blink>0) R.blink -= dt;

  // 뚱냥이 지수(먹인 만큼 통통)
  const targetFat = Math.min(1, S.fed/22);
  R.fatShow += (targetFat - R.fatShow) * Math.min(1, dt*2);

  // 날씨
  R.weather.t += dt;
  if(R.weather.t >= R.weather.dur) rollWeather();
  updateWeatherFX(dt);

  switch(R.mode){
    case 'power': {
      R.power += R.pdir * dt * 1.15;
      if(R.power>=1){ R.power=1; R.pdir=-1; }
      if(R.power<=0){ R.power=0; R.pdir=1; }
      break;
    }
    case 'cast': {
      const T = 0.62, k = Math.min(1, R.t/T);
      const ez = k;
      R.fx = R.castFrom.x + (R.castTo.x - R.castFrom.x)*ez;
      R.fy = R.castFrom.y + (R.castTo.y - R.castFrom.y)*ez - Math.sin(ez*Math.PI)*150;
      if(k>=1){ splash(R.fx, WATER, 12, 1); noise(.22,.11); afterSplash(); }
      break;
    }
    case 'wait': {
      R.fy = WATER - 4;
      if(R.t >= R.biteAt) startBite();
      break;
    }
    case 'bite': {
      if(R.t >= R.biteWin){
        R.mode='idle'; R.t=0;
        setStatus('놓쳤다! 입질 때 바로 눌러야 해요');
        SFX.escape(); R.fish=null;
        catSay(pick(['늦었어! 물고기도 기다려주는 거 아니야.','에이, 방금 거 맛있어 보였는데.']), 3000);
      }
      break;
    }
    case 'fight': {
      const f = R.fight;
      if(f.lock>0) f.lock -= dt;
      if(f.flashT>0) f.flashT -= dt;
      f.pos += f.dir * f.spd * dt;
      if(f.pos>1){ f.pos = 1; f.dir=-1; }
      if(f.pos<0){ f.pos = 0; f.dir=1; }
      break;
    }
    case 'reelin': {
      R.reelT += dt;
      // 찌를 고양이 쪽으로 당김
      R.fx += (ROD_HAND.x+40 - R.fx) * Math.min(1, dt*4.5);
      R.fy += (WATER-70 - R.fy) * Math.min(1, dt*4.5);
      if(R.reelT > 0.62){
        const f = R.fish;
        R.mode='over'; R.t=0;
        showResult(f);
      }
      break;
    }
  }

  // 파티클
  for(let i=R.parts.length-1;i>=0;i--){
    const p = R.parts[i];
    p.t += dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.vr) p.rot += p.vr*dt;
    p.a = Math.max(0, 1 - p.t/p.life);
    if(p.t>p.life) R.parts.splice(i,1);
  }
  for(let i=R.ripples.length-1;i>=0;i--){
    const w = R.ripples[i];
    w.r += dt*46; w.a -= dt*0.75;
    if(w.a<=0) R.ripples.splice(i,1);
  }
}

/* ------------------------- 렌더 ------------------------- */
function render(time, dt){
  ctx.save();
  if(R.shake>0){
    ctx.translate((Math.random()-.5)*R.shake, (Math.random()-.5)*R.shake);
  }
  ctx.clearRect(-40,-40,W+80,H+80);

  drawSky(time);
  drawWater(time);
  drawDock();
  drawLineAndFloat(time);
  drawCat(time);
  drawParticles();
  drawWeatherFX(time);

  if(R.mode==='power') drawPowerBar();
  if(R.mode==='fight') drawFightBar(time);
  if(R.mode==='bite') drawBiteMark(time);

  ctx.restore();

  if(R.flash>0){
    ctx.save();
    ctx.globalAlpha = Math.min(.85, R.flash);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

function drawSky(t){
  let g = ctx.createLinearGradient(0,0,0,WATER);
  g.addColorStop(0,'#070c1e'); g.addColorStop(.55,'#122046'); g.addColorStop(1,'#2b3f77');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,WATER);

  // 별
  for(const s of STARS){
    const tw = .35 + .65*Math.abs(Math.sin(t*s.sp + s.ph));
    ctx.globalAlpha = tw*.9;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 달
  const mx=760, my=88, mr=46;
  const halo = ctx.createRadialGradient(mx,my,mr*.6, mx,my,mr*3.4);
  halo.addColorStop(0,'rgba(255,246,206,.30)'); halo.addColorStop(1,'rgba(255,246,206,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(mx,my,mr*3.4,0,6.2832); ctx.fill();
  ctx.fillStyle='#fff6ce'; ctx.beginPath(); ctx.arc(mx,my,mr,0,6.2832); ctx.fill();
  ctx.fillStyle='rgba(224,214,170,.55)';
  [[-14,-10,8],[12,6,11],[2,22,5],[20,-18,5]].forEach(c=>{
    ctx.beginPath(); ctx.arc(mx+c[0],my+c[1],c[2],0,6.2832); ctx.fill();
  });

  // 먼 산
  ctx.fillStyle='#0d1530';
  ctx.beginPath(); ctx.moveTo(0,WATER);
  const pts=[[0,268],[90,236],[170,262],[280,220],[390,258],[500,232],[610,264],[720,240],[840,266],[960,244],[960,WATER]];
  pts.forEach((p,i)=> i? ctx.lineTo(p[0],p[1]) : ctx.lineTo(p[0],p[1]));
  ctx.lineTo(0,WATER); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0a1026';
  ctx.beginPath(); ctx.moveTo(0,WATER);
  [[0,290],[130,272],[250,292],[400,270],[540,294],[700,274],[860,296],[960,280],[960,WATER]].forEach(p=>ctx.lineTo(p[0],p[1]));
  ctx.closePath(); ctx.fill();
}

function drawWater(t){
  let g = ctx.createLinearGradient(0,WATER,0,H);
  g.addColorStop(0,'#16305e'); g.addColorStop(.5,'#0c1c3e'); g.addColorStop(1,'#060e22');
  ctx.fillStyle=g; ctx.fillRect(0,WATER,W,H-WATER);

  // 달 반사
  ctx.save();
  ctx.globalAlpha=.22;
  for(let i=0;i<13;i++){
    const y = WATER + 8 + i*15;
    const wdt = 68 - i*3 + Math.sin(t*1.7+i)*13;
    ctx.fillStyle='#ffe9a8';
    ctx.fillRect(760 - wdt/2 + Math.sin(t*1.2+i*.8)*9, y, wdt, 3.4);
  }
  ctx.restore();

  // 물결선
  const waveAmp = R.weather.key==='storm' ? 6.4 : (R.weather.key==='hightide' ? 5.2 : 3.2);
  ctx.strokeStyle='rgba(160,205,255,.14)'; ctx.lineWidth=1.6;
  for(let i=0;i<9;i++){
    const y = WATER + 14 + i*22;
    ctx.beginPath();
    for(let x=0;x<=W;x+=14){
      const yy = y + Math.sin((x*0.014) + t*(1.1+i*0.16) + i)*waveAmp;
      x? ctx.lineTo(x,yy) : ctx.moveTo(x,yy);
    }
    ctx.stroke();
  }

  // 물속 물고기 그림자 (대기 중)
  if(R.mode==='wait' && R.fish){
    const prog = Math.min(1, R.t / Math.max(.1,R.biteAt));
    const sx = R.fx + (1-prog)*(R.fx>W/2? 180 : -180) * Math.cos(R.t*1.6);
    const sy = WATER + 70 - prog*40;
    const ra = RARITY[R.fish.r];
    ctx.save();
    ctx.globalAlpha = .18 + prog*0.30;
    ctx.fillStyle = R.fish.r==='trans' ? 'rgba(255,255,255,.95)' : (R.fish.r==='myth' ? 'rgba(255,45,58,.95)' : (R.fish.r==='legend' ? 'rgba(255,190,90,.9)' : (R.fish.r==='epic'?'rgba(180,120,255,.85)':'#000')));
    const sc = 0.6 + RORDER.indexOf(R.fish.r)*0.22;
    ctx.beginPath(); ctx.ellipse(sx, sy, 26*sc, 10*sc, Math.sin(R.t*2)*0.14, 0, 6.2832); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx+24*sc, sy); ctx.lineTo(sx+38*sc, sy-9*sc); ctx.lineTo(sx+38*sc, sy+9*sc);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 파문
  for(const w of R.ripples){
    ctx.strokeStyle=`rgba(180,225,255,${w.a})`; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.ellipse(w.x, w.y, w.r, w.r*0.30, 0, 0, 6.2832); ctx.stroke();
  }
}

function rodAngle(){
  switch(R.mode){
    case 'power': return -1.05 - R.power*0.55;
    case 'cast':  return -1.05 + Math.min(1,R.t/0.28)*0.85;
    case 'wait':  return -0.62 + Math.sin(R.t*1.1)*0.02;
    case 'bite':  return -0.42;
    case 'fight': return -0.75 + Math.sin(R.t*13)*0.10 + (R.fight? R.fight.pos*0.12 : 0);
    case 'reelin':return -1.10;
    default:      return -0.80;
  }
}
function rodTip(){
  const a = rodAngle(), L = 176;
  return {x: ROD_HAND.x + Math.cos(a)*L, y: ROD_HAND.y + Math.sin(a)*L};
}

function drawLineAndFloat(t){
  if(R.mode==='idle' && !R.celebrating){
    // 대기 상태: 줄만 살짝 늘어뜨림
    const tip = rodTip();
    ctx.strokeStyle='rgba(220,235,255,.35)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(tip.x,tip.y);
    ctx.quadraticCurveTo(tip.x+16, tip.y+34, tip.x+8, tip.y+58); ctx.stroke();
    // 바늘
    ctx.strokeStyle='#cfd9ef'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(tip.x+8, tip.y+62, 4, .4, 4.6); ctx.stroke();
    return;
  }
  if(R.mode==='power'){
    const tip = rodTip();
    ctx.strokeStyle='rgba(220,235,255,.35)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(tip.x,tip.y);
    ctx.quadraticCurveTo(tip.x-10, tip.y-30, tip.x-26, tip.y-44); ctx.stroke();
    return;
  }
  const tip = rodTip();
  let fx = R.fx, fy = R.fy;
  let bob = 0;

  if(R.mode==='wait'){
    const nearNibble = Math.abs(R.t - R.nibble) < 0.35;
    bob = Math.sin(t*2.2)*2.2 + (nearNibble ? Math.sin(t*30)*4.5 : 0);
    if(nearNibble && Math.random()<0.16) R.ripples.push({x:fx,y:WATER,r:4,a:.4});
  }else if(R.mode==='bite'){
    bob = 12 + Math.sin(t*36)*4;   // 찌가 쑥 들어감
  }else if(R.mode==='fight'){
    bob = 8 + Math.sin(t*22)*6;
    fx = R.fx + Math.sin(t*7)*16;
    if(Math.random()<0.25) R.ripples.push({x:fx,y:WATER,r:5,a:.35});
  }

  const dy = fy + bob;

  // 낚싯줄 (늘어짐)
  ctx.strokeStyle='rgba(225,240,255,.55)'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
  const sag = (R.mode==='fight'||R.mode==='bite') ? 6 : 26;
  ctx.quadraticCurveTo((tip.x+fx)/2, Math.max(tip.y,dy) + sag, fx, dy);
  ctx.stroke();

  // 찌
  drawFloat(fx, dy);
}

function drawFloat(x,y){
  const lv = S.upg.float;
  const topCol = lv>=7 ? '#ff3ba0' : lv>=5 ? '#ffb020' : lv>=3 ? '#ff7a18' : '#e64545';
  // 안테나
  ctx.strokeStyle='#f4f7ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x, y-26); ctx.lineTo(x, y-9); ctx.stroke();
  ctx.fillStyle= topCol;
  ctx.beginPath(); ctx.arc(x, y-28, 3.4, 0, 6.2832); ctx.fill();
  if(lv>=4){
    ctx.fillStyle='rgba(255,220,120,.35)';
    ctx.beginPath(); ctx.arc(x, y-28, 8+Math.sin(performance.now()/300)*1.6, 0, 6.2832); ctx.fill();
  }
  // 몸통
  ctx.fillStyle= topCol;
  ctx.beginPath(); ctx.ellipse(x, y-3, 6.5, 9.5, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle='#f4f7ff';
  ctx.beginPath(); ctx.ellipse(x, y+2, 6.5, 9.5, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(x, y-1, 6.5, 10, 0,0,6.2832); ctx.stroke();
}

/* ---- 까미 ---- */
function drawCat(t){
  const fat = R.fatShow;
  const bx = CAT.x, by = CAT.y - 16;   // 부두 상판 위
  const breathe = Math.sin(t*1.9)*1.6;
  const excited = (R.mode==='bite'||R.mode==='fight');
  const jitter = excited ? Math.sin(t*26)*1.6 : 0;

  ctx.save();
  ctx.translate(jitter, 0);

  // 그림자
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(bx, by+2, 46+fat*9, 8, 0,0,6.2832); ctx.fill();

  // 꼬리
  const tw = Math.sin(t*(excited?7.5:2.1))*0.5;
  ctx.strokeStyle='#14151f'; ctx.lineWidth=13; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(bx-30, by-14);
  ctx.quadraticCurveTo(bx-78, by-24 + tw*26, bx-72, by-66 + tw*18);
  ctx.stroke();
  ctx.strokeStyle='#22232f'; ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(bx-30, by-14);
  ctx.quadraticCurveTo(bx-78, by-24 + tw*26, bx-72, by-66 + tw*18);
  ctx.stroke();

  // 몸통
  const bodyW = 40 + fat*11, bodyH = 50 + fat*5;
  const g = ctx.createLinearGradient(bx-40, by-90, bx+40, by);
  g.addColorStop(0,'#26283a'); g.addColorStop(.5,'#15161f'); g.addColorStop(1,'#0d0e15');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(bx, by-bodyH*0.55 + breathe*0.3, bodyW, bodyH, 0, 0, 6.2832);
  ctx.fill();
  drawCatOutfitBody(S.outfit, bx, by, bodyW, bodyH, breathe);

  // 앞발
  ctx.fillStyle='#1a1b26';
  ctx.beginPath(); ctx.ellipse(bx+14, by-6, 13, 8, 0,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx-9, by-5, 13, 8, 0,0,6.2832); ctx.fill();
  ctx.fillStyle='#2c2e40';
  ctx.beginPath(); ctx.ellipse(bx+14, by-8, 6.5, 4, 0,0,6.2832); ctx.fill();

  // 머리
  const hy = by - bodyH - 34 + breathe;
  const hx = bx + (excited? 5 : 2);
  const hr = 33;

  // 귀
  const earTw = (R.catMood==='alert') ? Math.sin(t*22)*0.16 : Math.sin(t*1.3)*0.03;
  drawEar(hx-22, hy-20, -0.35+earTw, hr);
  drawEar(hx+22, hy-20,  0.35-earTw, hr);

  const hg = ctx.createRadialGradient(hx-10, hy-12, 4, hx, hy, hr+8);
  hg.addColorStop(0,'#2b2d41'); hg.addColorStop(1,'#101119');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr-2, 0, 0, 6.2832); ctx.fill();

  // 눈
  const mood = R.catMood;
  const blinking = R.blink>0 && mood!=='star';
  const ex=[hx-12, hx+13], ey = hy-2;
  for(let i=0;i<2;i++){
    const X = ex[i];
    if(mood==='star'){
      drawStarEye(X, ey, 10 + Math.sin(t*9+i)*1.4);
      continue;
    }
    if(mood==='happy'){
      ctx.strokeStyle='#ffe36b'; ctx.lineWidth=3.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(X, ey+3, 8, Math.PI*1.12, Math.PI*1.88); ctx.stroke();
      continue;
    }
    if(mood==='sad'){
      ctx.strokeStyle='#c9d3ea'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(X, ey+9, 8, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
      continue;
    }
    const eh = blinking ? 1.6 : (mood==='alert' ? 12 : 9.5);
    ctx.fillStyle='#d8f24a';
    ctx.beginPath(); ctx.ellipse(X, ey, 8.4, eh, 0,0,6.2832); ctx.fill();
    if(!blinking){
      ctx.fillStyle='#10131c';
      const pw = (mood==='alert') ? 4.6 : 2.4;
      ctx.beginPath(); ctx.ellipse(X, ey, pw, eh-1.2, 0,0,6.2832); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(X-3, ey-4, 1.9, 0,6.2832); ctx.fill();
    }
  }

  // 코 & 입
  ctx.fillStyle='#ff9ab5';
  ctx.beginPath(); ctx.moveTo(hx, hy+11); ctx.lineTo(hx-4.5, hy+7); ctx.lineTo(hx+4.5, hy+7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#8e93ad'; ctx.lineWidth=1.7; ctx.lineCap='round';
  const openMouth = (mood==='star'||mood==='alert');
  if(openMouth){
    ctx.fillStyle='#4a1d2b';
    ctx.beginPath(); ctx.ellipse(hx, hy+17, 6.5, 6, 0,0,6.2832); ctx.fill();
    ctx.fillStyle='#ff9ab5';
    ctx.beginPath(); ctx.ellipse(hx, hy+20, 3.4, 2.6, 0,0,6.2832); ctx.fill();
  }else{
    ctx.beginPath(); ctx.arc(hx-4, hy+13, 4.4, 0, Math.PI*0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+4, hy+13, 4.4, Math.PI*0.15, Math.PI); ctx.stroke();
  }

  // 수염
  ctx.strokeStyle='rgba(230,238,255,.55)'; ctx.lineWidth=1.2;
  for(let s=-1;s<=1;s+=2){
    for(let i=0;i<3;i++){
      const yy = hy + 6 + i*5;
      ctx.beginPath();
      ctx.moveTo(hx + s*9, yy);
      ctx.quadraticCurveTo(hx + s*30, yy - 4 + i*3, hx + s*47, yy - 8 + i*6);
      ctx.stroke();
    }
  }

  drawCatOutfitHead(S.outfit, hx, hy, hr, t);

  // 목도리 (레벨업 훈장 느낌)
  if(S.upg.charm>1){
    ctx.fillStyle=['#e0454f','#ff8a3d','#63e6ff','#b06bff','#ffd166'][Math.min(4,S.upg.charm-1)];
    ctx.beginPath(); ctx.ellipse(hx-1, hy+hr-4, 26, 8, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.arc(hx-1, hy+hr+1, 4.5, 0, 6.2832); ctx.fill();
  }

  // 낚싯대
  drawRod();
  ctx.restore();
}

function drawStarEye(x,y,r){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#ffe36b';
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rr = i%2 ? r*0.45 : r;
    const px = Math.cos(ang)*rr, py = Math.sin(ang)*rr;
    i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawRod(){
  const a = rodAngle(), L=176;
  const hx = ROD_HAND.x, hy = ROD_HAND.y;
  const tx = hx + Math.cos(a)*L, ty = hy + Math.sin(a)*L;
  // 손잡이
  ctx.strokeStyle='#4a2f1c'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(hx - Math.cos(a)*26, hy - Math.sin(a)*26); ctx.lineTo(hx + Math.cos(a)*16, hy + Math.sin(a)*16); ctx.stroke();
  // 대 (레벨에 따라 색)
  const cols = ['#8a6b46','#a8804f','#c09a5c','#d4b06a','#9fd8ff','#b6a2ff','#ffb020','#ff6ec7'];
  ctx.strokeStyle = cols[Math.min(cols.length-1, S.upg.rod-1)];
  ctx.lineWidth=4.5;
  ctx.beginPath(); ctx.moveTo(hx + Math.cos(a)*14, hy + Math.sin(a)*14);
  const bend = (R.mode==='fight'||R.mode==='bite') ? 26 : (R.mode==='wait'? 8 : 2);
  ctx.quadraticCurveTo(hx+Math.cos(a)*L*0.55, hy+Math.sin(a)*L*0.55 + bend*0.4, tx, ty + bend);
  ctx.stroke();
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.moveTo(hx + Math.cos(a)*14, hy + Math.sin(a)*14);
  ctx.quadraticCurveTo(hx+Math.cos(a)*L*0.55, hy+Math.sin(a)*L*0.55 + bend*0.4, tx, ty + bend);
  ctx.stroke();
  // 릴
  ctx.fillStyle='#c9d3ea';
  ctx.beginPath(); ctx.arc(hx + Math.cos(a+1.4)*13, hy + Math.sin(a+1.4)*13, 7, 0, 6.2832); ctx.fill();
  ctx.fillStyle='#5a6584';
  ctx.beginPath(); ctx.arc(hx + Math.cos(a+1.4)*13, hy + Math.sin(a+1.4)*13, 3, 0, 6.2832); ctx.fill();
}

function drawParticles(){
  for(const p of R.parts){
    ctx.save();
    if(p.sq){
      ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r*0.6, p.r*2, p.r*1.2);
    }else{
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c + p.a + ')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function panel(x,y,w,h){
  ctx.fillStyle='rgba(8,12,26,.72)';
  roundRect(x,y,w,h,14); ctx.fill();
  ctx.strokeStyle='rgba(60,80,140,.7)'; ctx.lineWidth=1.5;
  roundRect(x,y,w,h,14); ctx.stroke();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function renderCreel(){

    $('creelSum').textContent = '';
    return;
  }
  const order = {trans:0,myth:1,legend:2,epic:3,rare:4,common:5,junk:6};
  const list = [...S.creel].sort((a,b)=> order[a.r]-order[b.r] || b.price-a.price);
  box.innerHTML = list.map(f=>{
    const ra = RARITY[f.r];
    return `<div class="row">
      <div class="ico fish-ico">${fishImageMarkup(f)}</div>
      <div class="info">
        <div class="nm"><span style="color:${ra.col}">${f.n}</span> <span class="tag ${ra.cls}">${ra.name}</span></div>
        <div class="ds">${f.cm}cm · 🪙 ${f.price}</div>
      </div>
      <div class="acts">
        <button class="mini sell" data-sell="${f.uid}">팔기</button>
        <button class="mini feed" data-feed="${f.uid}">🐾</button>
      </div>
    </div>`;
  }).join('');
  const total = S.creel.reduce((a,f)=>a+f.price,0);
  $('creelSum').innerHTML = `${S.creel.length}마리 · 총 🪙 <b>${total.toLocaleString()}</b>`;
  box.querySelectorAll('[data-sell]').forEach(b=> b.onclick = ()=> sellFish(b.dataset.sell));
  box.querySelectorAll('[data-feed]').forEach(b=> b.onclick = ()=> feedFish(b.dataset.feed));
}
function sellFish(uid){
  const i = S.creel.findIndex(f=>f.uid===uid); if(i<0) return;
  const f = S.creel.splice(i,1)[0];
  S.coins += f.price; save(); refreshHUD(); renderCreel(); SFX.coin();
}
function feedFish(uid){
  const i = S.creel.findIndex(f=>f.uid===uid); if(i<0) return;
  const f = S.creel.splice(i,1)[0];
  doFeed(f);
  renderCreel();
}
$('btnSellAll').onclick = ()=>{
  if(!S.creel.length) return;
  const total = S.creel.reduce((a,f)=>a+f.price,0);
  S.coins += total; S.creel = []; save(); refreshHUD(); renderCreel();
  SFX.coin(); tone(1320,.1,'square',.1,.07);
  catSay(`전부 팔았네. ${total.toLocaleString()}코인. …내 몫은?`, 4200);
};

/* 까미 먹이 주기 (이스터에그) */
function doFeed(f){
  const gain = {junk:0, common:3, rare:6, epic:12, legend:25, myth:45, trans:80}[f.r];
  const outfitWasLocked = S.aff < AFF_MAX;
  S.aff += gain; S.fed++;
  R.catMood = f.r==='junk' ? 'sad' : ((f.r==='legend' || f.r==='myth' || f.r==='trans') ? 'star':'happy');
  R.moodT = 0;
  const specialFeed = f.r==='legend' || f.r==='myth' || f.r==='trans';
  burst(CAT.x+20, WATER-150, f.r==='trans'?84:(f.r==='myth'?64:(specialFeed?46:16)),
        f.r==='trans' ? ['#fff4d6','#9be8ff','#ffd6f5','#fff'] : (f.r==='myth' ? ['#ff2d3a','#ff8c3c','#ffd0d3','#fff'] : (specialFeed ? ['#ffd166','#ff5d8f','#63e6ff','#fff'] : ['#ff9ab5','#ffd6e4','#fff'])));

  let line;
  if(f.r==='junk'){
    line = pick([
      '…이걸 나한테 준다고? 나 고양이야. 재활용은 네가 해.',
      '집사. 우리 사이에 이러기야?',
      '냄새는 좋은데 맛이 없어 보여. 아니 냄새도 별로야.',
    ]);
  }else if(f.id==='catfish'){
    line = CATFISH_LINE;
  }else if(f.id==='godzilla'){
    line = GODZILLA_LINE;
    const gift = 1500 + Math.floor(Math.random()*1500);
    S.coins += gift;
    setTimeout(()=> catSay(`도쿄 재건축 성금이래. 나도 몰라, 그냥 생겼어. 🪙${gift}`, 5200), 5400);
  }else if(f.r==='trans'){
    line = TRANS_LINES[f.id] || pick(TRANS_JOKES);
    const gift = 2200 + Math.floor(Math.random()*3200);
    S.coins += gift;
    setTimeout(()=> catSay(`초월적인 존재가 코인을 놓고 갔어. 나도 무서웠어. 🪙${gift}`, 5600), 5800);
  }else if(f.r==='myth'){
    line = pick(MYTH_JOKES);
    const gift = 700 + Math.floor(Math.random()*800);
    S.coins += gift;
    setTimeout(()=> catSay(`신화의 기운이 코인으로 변했어. 내가 한 건 아니고. 🪙${gift}`, 5200), 5400);
  }else if(f.r==='legend'){
    line = pick(LEGEND_JOKES);
    const gift = 200 + Math.floor(Math.random()*300);
    S.coins += gift;
    setTimeout(()=> catSay(`아 맞다. 이거 받아. 내가 어제 부둣가에서 주웠어. 🪙${gift}`, 5200), 5400);
  }else{
    line = nextJoke();
  }

  // 호감도 마일스톤
  const ms = feedMilestone();
  if(ms){ setTimeout(()=> catSay(ms.text, 7000), 5600); if(ms.coins){ S.coins += ms.coins; } }
  if(outfitWasLocked && S.aff>=AFF_MAX){
    burst(CAT.x+20, WATER-150, 72, ['#ffd166','#ff5df7','#63e6ff','#fff']);
    popText('🔓 까미 옷입히기 해금!', 50, 34, '#ffd166');
    setTimeout(()=> catSay('집사, 우리 이제 완전 절친이지? 상점에 내 옷이 들어왔대. 비싼 걸로 사줘.', 7600), 6600);
  }

  save(); refreshHUD();
  catSay(line, 6200);
  SFX.meow();
  if(f.r!=='junk') popText('💗 +'+gain, 20, 30, '#ffb1c8');
}
function nextJoke(){
  if(!S.jokeBag || !S.jokeBag.length){
    S.jokeBag = JOKES.map((_,i)=>i);
    for(let i=S.jokeBag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [S.jokeBag[i],S.jokeBag[j]]=[S.jokeBag[j],S.jokeBag[i]]; }
  }
  return JOKES[S.jokeBag.pop()];
}
function feedMilestone(){
  const M = {
    5:  {text:'너 은근히 성실하다. 좋아, 오늘부터 네 무릎은 내 자리야. 🪙150', coins:150},
    12: {text:'…사실 나 낚시할 줄 알아. 앞발로. 근데 젖는 게 싫어서 너 시키는 거야. 🪙400', coins:400},
    22: {text:'집사. 나 요즘 좀 무거워진 것 같지 않아? 착시야. 물고기 더 줘. 🪙800', coins:800},
    35: {text:'비밀 하나 알려줄게. 보름달 뜬 밤에 제일 멀리 던지면… 아니다, 직접 해봐. 🪙1500', coins:1500},
  };
  return M[S.fed] || null;
}

/* 상점 */
function renderShop(){
  $('shopList').innerHTML = UPG.map(u=>{
    const lv = S.upg[u.k];
    const maxed = lv>=u.max;
    const cost = maxed ? 0 : u.cost(lv);
    const can = !maxed && S.coins>=cost;
    return `<div class="row">
      <div class="ico">${u.e}</div>
      <div class="info">
        <div class="nm">${u.n} <span class="tag" style="color:#8b98bd">Lv.${lv}${maxed?' MAX':' / '+u.max}</span></div>
        <div class="ds">${u.d(lv)} — ${u.tip}</div>
        <div class="bar"><i style="width:${lv/u.max*100}%"></i></div>
      </div>
      <div class="acts">
        <button class="mini buy" data-up="${u.k}" ${(!can)?'disabled':''}>
          ${maxed?'MAX':'🪙 '+cost.toLocaleString()}
        </button>
      </div>
    </div>`;
  }).join('');
  $('shopList').querySelectorAll('[data-up]').forEach(b=> b.onclick = ()=> buyUpgrade(b.dataset.up));
  renderOutfitShop();
  $('shopCoins').textContent = S.coins.toLocaleString();
}
function renderOutfitShop(){
  const box = $('outfitShop');
  const pct = Math.min(100, Math.floor(S.aff/AFF_MAX*100));
  if(S.aff < AFF_MAX){
    box.innerHTML = `<div class="shop-section">🔒 엔드 콘텐츠 · 까미 옷입히기</div>
      <div class="outfit-lock"><b>까미 호감도 100% 필요</b>현재 ${pct}% · 물고기를 선물해 마음을 열어주세요.</div>`;
    return;
  }
  const baseEquipped = S.outfit === 'none';
  const rows = OUTFITS.map((o,i)=>{
    const owned = S.ownedOutfits.includes(o.id);
    const equipped = S.outfit === o.id;
    const prereq = i===0 ? null : OUTFITS[i-1];
    const prereqOwned = !prereq || S.ownedOutfits.includes(prereq.id);
    const locked = !owned && !prereqOwned;
    const canBuy = !locked && S.coins >= o.price;
    return `<div class="row outfit-row ${equipped?'equipped':''} ${locked?'locked-outfit':''}">
      <div class="ico">${locked?'🔒':o.e}</div>
      <div class="info">
        <div class="nm">${o.n}${equipped?' <span class="tag" style="color:#ffb020">착용 중</span>':''} <span class="tag" style="color:#8ad4ff">고등급 확률 +${o.bonus}%</span></div>
        <div class="ds">${locked ? `${prereq.n} 먼저 구매해야 해금돼요` : o.d}</div>
      </div>
      <div class="acts"><button class="mini buy" data-outfit="${o.id}" ${(!owned&&!canBuy)?'disabled':''}>
        ${equipped?'착용 중':(owned?'입기':(locked?'🔒 잠김':'🪙 '+o.price.toLocaleString()))}
      </button></div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="shop-section">✨ 엔드 콘텐츠 · 까미 옷입히기 <span class="tag" style="color:#c8f08a">해금 완료</span></div>
    <div class="row outfit-row ${baseEquipped?'equipped':''}">
      <div class="ico">🐈‍⬛</div><div class="info"><div class="nm">기본 까미${baseEquipped?' <span class="tag" style="color:#ffb020">착용 중</span>':''}</div><div class="ds">검은 털이 제일 멋지다는 까미의 주장</div></div>
      <div class="acts"><button class="mini buy" data-outfit="none">${baseEquipped?'착용 중':'입기'}</button></div>
    </div>${rows}`;
  box.querySelectorAll('[data-outfit]').forEach(b=> b.onclick = ()=> buyOrEquipOutfit(b.dataset.outfit));
}
function buyOrEquipOutfit(id){
  if(S.aff < AFF_MAX) return;
  if(id==='none'){
    S.outfit='none'; save(); renderShop();
    catSay('역시 자연스러운 검은 털이 최고지. 관리비도 안 들고.', 3800);
    return;
  }
  const o = OUTFIT_BY_ID[id];
  if(!o) return;
  if(!S.ownedOutfits.includes(id)){
    const idx = OUTFITS.findIndex(x=>x.id===id);
    const prereq = idx>0 ? OUTFITS[idx-1] : null;
    if(prereq && !S.ownedOutfits.includes(prereq.id)) return;
    if(S.coins < o.price) return;
    S.coins -= o.price;
    S.ownedOutfits.push(id);
    SFX.coin(); tone(1046,.12,'triangle',.13,.08); tone(1396,.18,'triangle',.12,.18);
  }
  S.outfit = id;
  save(); refreshHUD(); renderShop();
  R.catMood='star'; R.moodT=0;
  burst(CAT.x+10, WATER-120, 46, ['#ffd166','#ff5df7','#63e6ff','#fff']);
  catSay(`${o.n} 어때? 잘 어울리는 건 알아. 더 크게 말해봐.`, 4800);
}
function buyUpgrade(k){
  const u = UPG.find(x=>x.k===k); const lv = S.upg[k];
  if(lv>=u.max) return;
  const cost = u.cost(lv);
  if(S.coins < cost) return;
  S.coins -= cost; S.upg[k] = lv+1; save();
  refreshHUD(); renderShop();
  SFX.coin(); tone(880,.12,'triangle',.14,.06); tone(1174,.16,'triangle',.13,.14);
  catSay(pick([
    `${u.n} 업그레이드! 이제 좀 낚시꾼 같네.`,
    `오, ${u.n} Lv.${lv+1}. 기대할게. 부담 가져.`,
    `장비만 좋아지고 실력은 그대로면 곤란한데?`,
  ]), 3600);
}

/* 도감 */
function renderDex(){
  const got = Object.keys(S.dex).length;
  $('dexSub').innerHTML = `수집 <b>${got}</b> / ${FISH.length} 종 · 총 <b>${S.totalCatch}</b>마리 낚음`;
  $('dexList').innerHTML = RORDER.map(rk=>{
    const list = FISH.filter(f=>f.r===rk);
    const ra = RARITY[rk];
    return `<div style="margin:12px 0 6px;font-size:12px;font-weight:900" class="${ra.cls}">${ra.name}</div>
    <div class="dexgrid">` + list.map(f=>{
      const d = S.dex[f.id];
      if(!d) return `<div class="dexcell locked"><div class="e">❔</div><div class="n">???</div><div class="c">미발견</div></div>`;
      return `<div class="dexcell"><div class="e">${fishImageMarkup(f)}</div>
        <div class="n" style="color:${ra.col}">${f.n}</div>
        <div class="c">×${d.c} · 최대 ${d.best}cm</div></div>`;
    }).join('') + `</div>`;
  }).join('');
}

/* 결과 모달 버튼 */
let pendingFish = null;
function resumeFishing(){
  R.mode='idle'; R.t=0; R.fish=null; R.fight=null;
  setStatus('클릭 또는 <span class="k">스페이스</span>로 낚싯대를 던져요');
}
function autoKeepResult(){
  if(pendingFish){
    S.creel.push(pendingFish);
    pendingFish=null;
    save(); refreshHUD();
    popText('🧺 어망에 자동 보관', 50, 43, '#c8f08a');
  }
  resumeFishing();
}
function bindResult(){
  $('rKeep').onclick = ()=>{
    if(pendingFish){ S.creel.push(pendingFish); save(); refreshHUD(); }
    pendingFish=null; closeModals(); resumeFishing();
  };
  $('rSell').onclick = ()=>{
    if(pendingFish){ S.coins += pendingFish.price; save(); refreshHUD(); SFX.coin();
      popText('🪙 +'+pendingFish.price, 50, 46, '#ffc24a'); }
    pendingFish=null; closeModals(); resumeFishing();
  };
  $('rFeed').onclick = ()=>{
    if(pendingFish){ doFeed(pendingFish); }
    pendingFish=null; closeModals(); resumeFishing();
  };
}
bindResult();

/* showResult 훅: pendingFish 세팅 */
const _showResult = showResult;
showResult = function(f){ pendingFish = f; _showResult(f); };

/* 버튼 */
$('btnCreel').onclick = ()=>{ renderCreel(); openModal('ovlCreel'); };
$('btnShop').onclick  = ()=>{ renderShop();  openModal('ovlShop'); };
$('btnDex').onclick   = ()=>{ renderDex();   openModal('ovlDex'); };
$('btnSound').onclick = ()=>{ S.sound=!S.sound; save(); refreshHUD(); if(S.sound){ac(); tone(880,.1,'triangle',.12);} };
$('btnReset').onclick = ()=>{
  if(!confirm('모든 기록(코인·도감·업그레이드·까미 호감도·구매한 의상)을 지울까요?')) return;
  S = defaultState(); save(); refreshHUD(); renderShop(); closeModals();
  R.mode='idle'; R.fish=null; R.fight=null;
  setStatus('처음부터 다시! 클릭 또는 <span class="k">스페이스</span>로 던져요');
  catSay('어? 나 기억 잃었어. 누구세요? …농담이야. 다시 시작하자.', 5000);
};

/* 입력 */
stage.addEventListener('click', e=>{ e.preventDefault(); action(); });
stage.addEventListener('touchstart', e=>{ e.preventDefault(); action(); }, {passive:false});
window.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.code==='Enter'){
    e.preventDefault();
    if(document.querySelector('.ovl.on')){ closeModals(); return; }
    action();
  }
  if(e.code==='Escape') closeModals();
  if(e.key==='s'||e.key==='S') $('btnShop').click();
  if(e.key==='c'||e.key==='C') $('btnCreel').click();
  if(e.key==='d'||e.key==='D') $('btnDex').click();
});

/* 시작 */
refreshHUD();
setWeather(pickWeatherKey(null), false);
setStatus('클릭 또는 <span class="k">스페이스</span>로 낚싯대를 던져요');
setTimeout(()=> catSay('밤이 좋다. 물고기도 자고 있거든. …그럼 어떻게 잡지? 아무튼 던져봐.', 6000), 900);
</script>
</body>
</html>
